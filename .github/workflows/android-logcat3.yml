name: Android launch diagnostics (manual)

# Manual-only diagnostic. Does not publish releases, does not push to branches,
# and does not download hardcoded release APKs. Builds from source and uploads
# logcat as an artifact.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch, tag, or SHA)'
        required: false
        default: 'main'
        type: string

permissions: {}

concurrency:
  group: android-logcat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  logcat:
    name: Emulator logcat capture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5.0.1

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and capture logcat
        uses: reactivecircus/android-emulator-runner@69c8581131285561115a2e413eb0037446bdc2d6 # v2.35.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell monkey -p com.orbit.app -c android.intent.category.LAUNCHER 1 || true
            sleep 25
            adb logcat -d -v threadtime > logcat-full.txt || true
            {
              echo "=== matched ==="
              grep -iE 'orbit|reactnative|androidruntime|fatal|expo|sqlite|securestore|splash|jserror|turbo|so loader|anr' logcat-full.txt | tail -500 || true
              echo "=== tail ==="
              tail -250 logcat-full.txt
            } > logcat.txt

      - name: Upload logcat artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ORBIT-logcat
          path: |
            logcat.txt
            logcat-full.txt
          if-no-files-found: warn
          overwrite: true
          retention-days: 14
