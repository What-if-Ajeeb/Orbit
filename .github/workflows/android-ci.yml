name: Android Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Request creation of a public GitHub Release'
        required: false
        type: boolean
        default: false
      confirm_public_release:
        description: 'Confirm: I authorize publishing this public GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Version tag for the release (required when publish_release is true), e.g. v1.11.0'
        required: false
        type: string
  push:
    branches: [main]
    # Tag pushes only build/upload artifacts. Releases are manual-only.
    tags: ['v*']

permissions:
  contents: read

concurrency:
  # Keep manual release runs in their own group so a normal main push can
  # never cancel an authorized release run mid-flight.
  group: android-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Validate manual release request
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
          CONFIRM_PUBLIC_RELEASE: ${{ github.event.inputs.confirm_public_release }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_RELEASE" != "true" ]; then
            echo "Artifact-only run; no GitHub Release will be published."
            exit 0
          fi
          if [ "$CONFIRM_PUBLIC_RELEASE" != "true" ]; then
            echo "::error::publish_release=true requires confirm_public_release=true."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9][0-9A-Za-z._-]*$'; then
            echo "::error::A valid release_tag is required, such as v1.11.0."
            exit 1
          fi
          echo "Manual release request validated for $RELEASE_TAG."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        env:
          ORBIT_RELEASE_STORE_FILE: ${{ secrets.ORBIT_RELEASE_STORE_FILE }}
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          old4 = '\n'.join([
              '    signingConfigs {',
              '        debug {',
              "            storeFile file('debug.keystore')",
              "            storePassword 'android'",
              "            keyAlias 'androiddebugkey'",
              "            keyPassword 'android'",
              '        }',
              '    }',
              '    buildTypes {',
              '        debug {',
              '            signingConfig signingConfigs.debug',
              '        }',
              '        release {',
              '            // Caution! In production, you need to generate your own keystore file.',
              '            // see https://reactnative.dev/docs/signed-apk-android.',
              '            signingConfig signingConfigs.debug',
              "            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'",
              '            shrinkResources enableShrinkResources.toBoolean()',
              '            minifyEnabled enableMinifyInReleaseBuilds',
              '            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"',
              "            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'",
              '            crunchPngs enablePngCrunchInRelease.toBoolean()',
              '        }',
              '    }',
          ])
          new4 = '\n'.join([
              '    signingConfigs {',
              '        debug {',
              "            storeFile file('debug.keystore')",
              "            storePassword 'android'",
              "            keyAlias 'androiddebugkey'",
              "            keyPassword 'android'",
              '        }',
              '        release {',
              "            def releaseStoreFile = System.getenv('ORBIT_RELEASE_STORE_FILE')",
              '            if (releaseStoreFile) {',
              '                storeFile file(releaseStoreFile)',
              "                storePassword System.getenv('ORBIT_RELEASE_STORE_PASSWORD')",
              "                keyAlias System.getenv('ORBIT_RELEASE_KEY_ALIAS')",
              "                keyPassword System.getenv('ORBIT_RELEASE_KEY_PASSWORD')",
              '            } else {',
              "                storeFile file('debug.keystore')",
              "                storePassword 'android'",
              "                keyAlias 'androiddebugkey'",
              "                keyPassword 'android'",
              '            }',
              '        }',
              '    }',
              '    buildTypes {',
              '        debug {',
              '            signingConfig signingConfigs.debug',
              '        }',
              '        release {',
              '            signingConfig signingConfigs.release',
              "            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'",
              '            shrinkResources enableShrinkResources.toBoolean()',
              '            minifyEnabled enableMinifyInReleaseBuilds',
              '            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"',
              "            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'",
              '            crunchPngs enablePngCrunchInRelease.toBoolean()',
              '        }',
              '    }',
          ])
          if old4 in s:
              p.write_text(s.replace(old4, new4))
              print('patched signing config')
          else:
              print('signing config pattern not found; keeping generated config')
          PYTHON
          if [ -n "$ORBIT_RELEASE_STORE_FILE" ]; then
            echo "$ORBIT_RELEASE_STORE_FILE" | base64 -d > android/app/release.keystore
            echo "ORBIT_RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK and AAB
        env:
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ORBIT-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ORBIT-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/ORBIT-release.aab
          ls -la artifacts
          echo "HAS_RELEASE_SIGNING=${HAS_RELEASE_SIGNING:-false}" > artifacts/build-info.txt
          if [ "${HAS_RELEASE_SIGNING:-false}" != "true" ]; then
            echo "Release APK/AAB are debug-signed fallback because signing secrets are not configured." >> artifacts/build-info.txt
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-android
          path: artifacts/*
          if-no-files-found: error

  # Strict policy: tag pushes and main pushes never publish. Only an
  # explicitly confirmed workflow_dispatch may create a GitHub Release.
  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      needs.build.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_release == 'true' &&
      github.event.inputs.confirm_public_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ORBIT-android
          path: release-assets
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          for f in ORBIT-debug.apk ORBIT-release.apk ORBIT-release.aab build-info.txt; do
            path="release-assets/$f"
            if [ ! -s "$path" ]; then
              echo "::error::Missing or empty release artifact: $f"
              exit 1
            fi
            case "$f" in
              *.apk|*.aab) unzip -tq "$path" >/dev/null ;;
            esac
            size=$(stat -c '%s' "$path")
            echo "$f: ${size} bytes"
          done
          cat release-assets/build-info.txt

      - name: Resolve release tag
        id: release_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::GitHub Releases are manual-only."
            exit 1
          fi
          tag="$INPUT_TAG"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9][0-9A-Za-z._-]*$'; then
            echo "::error::A valid release_tag is required, such as v1.11.0."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Verify release authorization
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            echo "::error::GitHub Releases are manual-only."
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for $TAG already exists. Refusing to overwrite it."
            exit 1
          fi

          # Refuse to attach this run's artifacts to a tag that points at a
          # different commit. A missing tag will be created at this commit.
          tag_lines=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}" "refs/tags/${TAG}^{}")
          if [ -n "$tag_lines" ]; then
            tag_sha=$(printf '%s\n' "$tag_lines" | awk '/\^\{\}$/ {print $1; exit}')
            if [ -z "$tag_sha" ]; then
              tag_sha=$(printf '%s\n' "$tag_lines" | awk 'NR == 1 {print $1}')
            fi
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG points to $tag_sha, not this workflow commit $GITHUB_SHA. Refusing to publish mismatched artifacts."
              exit 1
            fi
            echo "Tag $TAG already points to the workflow commit."
          else
            echo "Tag $TAG does not exist; the release will create it at $GITHUB_SHA."
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            release-assets/ORBIT-debug.apk \
            release-assets/ORBIT-release.apk \
            release-assets/ORBIT-release.aab \
            release-assets/build-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

      - name: Verify published release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.release_tag.outputs.tag }}
        run: |
          set -euo pipefail
          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          asset_names=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for f in ORBIT-debug.apk ORBIT-release.apk ORBIT-release.aab build-info.txt; do
            if ! printf '%s\n' "$asset_names" | grep -Fxq "$f"; then
              echo "::error::Release $TAG is missing asset $f"
              exit 1
            fi
          done

          asset_sizes=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) (\(.size) bytes)"')
          echo "Published release: $url"
          echo "$asset_sizes"
          {
            echo "### GitHub Release"
            echo "- Tag: \`$TAG\`"
            echo "- URL: $url"
            echo "- Assets:"
            echo "$asset_sizes" | sed 's/^/  - /'
          } >> "$GITHUB_STEP_SUMMARY"
