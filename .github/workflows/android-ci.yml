name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Configure release signing
        env:
          ORBIT_RELEASE_STORE_FILE: ${{ secrets.ORBIT_RELEASE_STORE_FILE }}
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PYTHON'
          import os, pathlib
          p = pathlib.Path('android/app/build.gradle')
          s = p.read_text()
          old4 = '\n'.join([
              '    signingConfigs {',
              '        debug {',
              "            storeFile file('debug.keystore')",
              "            storePassword 'android'",
              "            keyAlias 'androiddebugkey'",
              "            keyPassword 'android'",
              '        }',
              '    }',
              '    buildTypes {',
              '        debug {',
              '            signingConfig signingConfigs.debug',
              '        }',
              '        release {',
              '            // Caution! In production, you need to generate your own keystore file.',
              '            // see https://reactnative.dev/docs/signed-apk-android.',
              '            signingConfig signingConfigs.debug',
              "            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'",
              '            shrinkResources enableShrinkResources.toBoolean()',
              '            minifyEnabled enableMinifyInReleaseBuilds',
              '            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"',
              "            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'",
              '            crunchPngs enablePngCrunchInRelease.toBoolean()',
              '        }',
              '    }',
          ])
          new4 = '\n'.join([
              '    signingConfigs {',
              '        debug {',
              "            storeFile file('debug.keystore')",
              "            storePassword 'android'",
              "            keyAlias 'androiddebugkey'",
              "            keyPassword 'android'",
              '        }',
              '        release {',
              "            def releaseStoreFile = System.getenv('ORBIT_RELEASE_STORE_FILE')",
              '            if (releaseStoreFile) {',
              '                storeFile file(releaseStoreFile)',
              "                storePassword System.getenv('ORBIT_RELEASE_STORE_PASSWORD')",
              "                keyAlias System.getenv('ORBIT_RELEASE_KEY_ALIAS')",
              "                keyPassword System.getenv('ORBIT_RELEASE_KEY_PASSWORD')",
              '            } else {',
              "                storeFile file('debug.keystore')",
              "                storePassword 'android'",
              "                keyAlias 'androiddebugkey'",
              "                keyPassword 'android'",
              '            }',
              '        }',
              '    }',
              '    buildTypes {',
              '        debug {',
              '            signingConfig signingConfigs.debug',
              '        }',
              '        release {',
              '            signingConfig signingConfigs.release',
              "            def enableShrinkResources = findProperty('android.enableShrinkResourcesInReleaseBuilds') ?: 'false'",
              '            shrinkResources enableShrinkResources.toBoolean()',
              '            minifyEnabled enableMinifyInReleaseBuilds',
              '            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"',
              "            def enablePngCrunchInRelease = findProperty('android.enablePngCrunchInReleaseBuilds') ?: 'true'",
              '            crunchPngs enablePngCrunchInRelease.toBoolean()',
              '        }',
              '    }',
          ])
          if old4 in s:
              p.write_text(s.replace(old4, new4))
              print('patched signing config')
          else:
              print('signing config pattern not found; keeping generated config')
          PYTHON
          if [ -n "$ORBIT_RELEASE_STORE_FILE" ]; then
            echo "$ORBIT_RELEASE_STORE_FILE" | base64 -d > android/app/release.keystore
            echo "ORBIT_RELEASE_STORE_FILE=release.keystore" >> "$GITHUB_ENV"
            echo "HAS_RELEASE_SIGNING=true" >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK and AAB
        env:
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ORBIT-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ORBIT-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/ORBIT-release.aab
          ls -la artifacts
          echo "HAS_RELEASE_SIGNING=${HAS_RELEASE_SIGNING:-false}" > artifacts/build-info.txt
          if [ "${HAS_RELEASE_SIGNING:-false}" != "true" ]; then
            echo "Release APK/AAB are debug-signed fallback because signing secrets are not configured." >> artifacts/build-info.txt
          fi

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-android
          path: artifacts/*
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ORBIT-debug.apk
            artifacts/ORBIT-release.apk
            artifacts/ORBIT-release.aab
            artifacts/build-info.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
