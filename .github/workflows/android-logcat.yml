name: Android launch diagnostics

on:
  push:
    tags:
      - 'diag-*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-logcat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  logcat:
    name: Boot app on Android 16 and capture logcat
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 emulator image
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager --install \
            "platform-tools" \
            "emulator" \
            "system-images;android-36;google_apis;x86_64"

      - name: Create and boot emulator
        run: |
          echo no | avdmanager create avd \
            -n orbit-api36 \
            -k "system-images;android-36;google_apis;x86_64" \
            --device "pixel_7" \
            --force
          emulator -avd orbit-api36 -no-audio -no-window -gpu swiftshader_indirect -no-boot-anim > /tmp/opencode-emulator.log 2>&1 &
          adb wait-for-device
          adb shell 'while [ -z "$(getprop sys.boot_completed)" ]; do sleep 2; done'
          adb shell input keyevent 82
          adb shell getprop ro.build.version.release
          adb shell getprop ro.build.version.sdk

      - name: Install and launch Orbit
        run: |
          curl -sL -o orbit.apk \
            "https://github.com/What-if-Ajeeb/Orbit/releases/download/v1.9.2/orbit-v1.9.2.apk"
          adb install -r orbit.apk
          adb logcat -c
          adb shell monkey -p com.orbit.app -c android.intent.category.LAUNCHER 1
          sleep 25
          adb logcat -d -v threadtime > logcat-full.txt

      - name: Summarize crash signatures
        run: |
          {
            echo "=== Matching logcat lines ==="
            grep -iE 'orbit|reactnative|androidruntime|fatal|webview|expo|sqldatabase|securestore|splash|jserror|turbo|so loader' logcat-full.txt | tail -400 || true
            echo
            echo "=== Last 200 lines ==="
            tail -200 logcat-full.txt
          } > logcat.txt
          cat logcat.txt

      - name: Publish logcat to diag-logs branch
        run: |
          git config user.name "orbit-ci"
          git config user.email "orbit-ci@users.noreply.github.com"
          git checkout -B diag-logs
          git add -f logcat.txt logcat-full.txt
          git commit -m "Capture Android 16 launch logcat" || true
          git push -f origin diag-logs
