name: Android

# Orbit Android pipeline (Expo SDK 58 / RN 0.88)
#
# Triggers:
#   - push main / PR  → CI artifacts only
#   - tag v*          → CI artifacts only (never publishes)
#   - workflow_dispatch with publish=true + confirm=true + tag
#                     → build + publish GitHub Release
#
# Signing:
#   Optional for artifact-only builds (debug keystore fallback).
#   Required for publishing: publish_release=true fails unless the ORBIT_*
#   signing secrets are present and the build reports signed=true.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a public GitHub Release after build'
        type: boolean
        default: false
      confirm_public_release:
        description: 'I confirm publishing this public release'
        type: boolean
        default: false
      release_tag:
        description: 'Tag to publish, must match v{app.json version} e.g. v1.10.6'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: ver
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::app.json ($APP_VERSION) and package.json ($PKG_VERSION) versions differ"
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

      - name: Validate release request
        if: github.event_name == 'workflow_dispatch'
        env:
          PUBLISH_RELEASE: ${{ github.event.inputs.publish_release }}
          CONFIRM_PUBLIC_RELEASE: ${{ github.event.inputs.confirm_public_release }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH_RELEASE" != "true" ]; then
            echo "Artifact-only run; no GitHub Release will be published."
            exit 0
          fi
          if [ "$CONFIRM_PUBLIC_RELEASE" != "true" ]; then
            echo "::error::publish_release=true requires confirm_public_release=true."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases can only be published from main (got $GITHUB_REF)."
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release_tag must look like v1.10.6 (got '$RELEASE_TAG')."
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v${APP_VERSION}" ]; then
            echo "::error::release_tag must equal v${APP_VERSION} (the app.json version), got '$RELEASE_TAG'."
            exit 1
          fi
          echo "Release request validated for $RELEASE_TAG."

      - name: Configure release signing (optional)
        id: signing
        env:
          PUBLISH_REQUESTED: ${{ github.event.inputs.publish_release }}
          ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ORBIT_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ORBIT_RELEASE_STORE_PASSWORD:-}" ] && \
             [ -n "${ORBIT_RELEASE_KEY_ALIAS:-}" ] && \
             [ -n "${ORBIT_RELEASE_KEY_PASSWORD:-}" ]; then
            mkdir -p android-signing
            echo "$ORBIT_KEYSTORE_BASE64" | base64 -d > android-signing/release.keystore
            chmod 600 android-signing/release.keystore
            if [ ! -s android-signing/release.keystore ]; then
              echo "::error::Decoded keystore is empty"
              exit 1
            fi
            if ! keytool -list -keystore android-signing/release.keystore \
                -storepass "$ORBIT_RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Keystore cannot be opened with the given store password"
              exit 1
            fi
            {
              echo "ORBIT_KEYSTORE_PATH=$GITHUB_WORKSPACE/android-signing/release.keystore"
              echo "ORBIT_RELEASE_STORE_PASSWORD=$ORBIT_RELEASE_STORE_PASSWORD"
              echo "ORBIT_RELEASE_KEY_ALIAS=$ORBIT_RELEASE_KEY_ALIAS"
              echo "ORBIT_RELEASE_KEY_PASSWORD=$ORBIT_RELEASE_KEY_PASSWORD"
              echo "ORBIT_REQUIRE_RELEASE_SIGNING=0"
              echo "SIGNED=true"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets found — will sign with release keystore"
          else
            if [ "${PUBLISH_REQUESTED:-}" = "true" ]; then
              echo "::error::publish_release=true requires release-signing secrets (ORBIT_KEYSTORE_BASE64, ORBIT_RELEASE_*)."
              exit 1
            fi
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release signing secrets — artifact-only build will use the debug keystore"
          fi

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK + AAB
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ORBIT-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ORBIT-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/ORBIT-release.aab

          for f in ORBIT-debug.apk ORBIT-release.apk ORBIT-release.aab; do
            if [ ! -s "artifacts/$f" ]; then
              echo "::error::Missing or empty: $f"
              exit 1
            fi
            unzip -tq "artifacts/$f" >/dev/null
          done

          (cd artifacts && sha256sum ORBIT-debug.apk ORBIT-release.apk ORBIT-release.aab > SHA256SUMS.txt)

          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "app_version=${{ steps.ver.outputs.version }}"
            echo "package=com.orbit.app"
            echo "signed=${{ steps.signing.outputs.signed }}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/build-info.txt

          ls -la artifacts
          cat artifacts/build-info.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ORBIT-android
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup keystore
        if: always()
        run: rm -rf android-signing

  release:
    name: Publish GitHub Release
    needs: build
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.publish_release == 'true' &&
      github.event.inputs.confirm_public_release == 'true' &&
      needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - name: Validate release inputs
        env:
          RELEASE_TAG: ${{ github.event.inputs.release_tag }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be published from main (got $GITHUB_REF)"
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::release_tag must look like v1.10.6 (got '$RELEASE_TAG')"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v${APP_VERSION}" ]; then
            echo "::error::release_tag must equal v${APP_VERSION} (app.json version), got '$RELEASE_TAG'"
            exit 1
          fi
          if [ "$SIGNED" != "true" ]; then
            echo "::error::Refusing to publish an unsigned build."
            exit 1
          fi
          echo "Will publish signed build $RELEASE_TAG"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ORBIT-android
          path: release-assets

      - name: Verify artifacts
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release-assets
          for f in ORBIT-release.apk ORBIT-release.aab SHA256SUMS.txt build-info.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing release asset: $f"
              exit 1
            fi
          done
          for f in ORBIT-release.apk ORBIT-release.aab; do
            unzip -tq "$f" >/dev/null
          done
          sha256sum -c SHA256SUMS.txt
          grep -qx 'signed=true' build-info.txt || { echo "::error::build-info.txt does not say signed=true"; exit 1; }
          grep -qx "app_version=${APP_VERSION}" build-info.txt || { echo "::error::build-info.txt app version does not match"; exit 1; }
          cat build-info.txt
          cat SHA256SUMS.txt

      - name: Create draft, verify, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump version and use a new tag."
            exit 1
          fi

          cleanup() {
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          }
          trap cleanup ERR

          gh release create "$TAG" \
            release-assets/ORBIT-release.apk \
            release-assets/ORBIT-release.aab \
            release-assets/SHA256SUMS.txt \
            release-assets/build-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --draft

          asset_names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in ORBIT-release.apk ORBIT-release.aab SHA256SUMS.txt build-info.txt; do
            if ! printf '%s\n' "$asset_names" | grep -Fxq "$f"; then
              echo "::error::Draft release $TAG is missing asset $f"
              exit 1
            fi
          done

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          trap - ERR

          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Published: $url"
          echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
