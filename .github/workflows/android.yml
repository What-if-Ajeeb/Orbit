name: Android

# Orbit Android pipeline (Expo SDK 58 / RN 0.88)
#
# Triggers:
#   - push main / PR   → build + CI artifacts only
#   - push tag v*      → build + publish GitHub Release (tag must match app version)
#   - workflow_dispatch → artifact-only unless publish_release is checked
#
# Publishing a release is as simple as:
#   git tag -a v1.10.6 -m "Orbit v1.10.6" && git push origin v1.10.6
#
# Signing:
#   Optional. Without ORBIT_* secrets the APK/AAB are debug-signed and the
#   release notes are marked accordingly.
#   Set repository variable ORBIT_REQUIRE_RELEASE_SIGNING=true to block
#   publishing unsigned builds once signing secrets are configured.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'CHECK to publish a public GitHub Release (tag defaults to v<app.json version>)'
        type: boolean
        default: false
      release_tag:
        description: 'Optional: must equal v<app.json version>; leave empty to use the current version'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: android-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    name: Build Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.signing.outputs.signed }}
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          sdkmanager "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - name: Install dependencies
        run: npm ci

      - name: Read app version
        id: ver
        run: |
          set -euo pipefail
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$APP_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::app.json ($APP_VERSION) and package.json ($PKG_VERSION) versions differ"
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $APP_VERSION"

      - name: Resolve release request
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH: ${{ github.event.inputs.publish_release }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
          APP_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail

          publish=false
          tag=""

          if [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            publish=true
            tag="$REF_NAME"
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PUBLISH" = "true" ]; then
            publish=true
            tag="${INPUT_TAG:-v${APP_VERSION}}"
          fi

          if [ "$publish" = "true" ]; then
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
              echo "::error::Releases can only be published from main (got $REF)."
              exit 1
            fi
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Release tag must look like v1.10.6 (got '$tag')."
              exit 1
            fi
            if [ "$tag" != "v${APP_VERSION}" ]; then
              echo "::error::Release tag must equal v${APP_VERSION} (the app.json version), got '$tag'."
              exit 1
            fi
            if [ "$EVENT_NAME" = "push" ]; then
              compare_status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status 2>/dev/null || echo unknown)"
              case "$compare_status" in
                behind|identical) ;;
                *)
                  echo "::error::Tag commit is not on main (compare status: $compare_status)."
                  exit 1
                  ;;
              esac
            fi
            echo "Release requested for $tag"
          else
            echo "Artifact-only run; no GitHub Release will be published."
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Configure release signing (optional)
        id: signing
        env:
          PUBLISH_REQUESTED: ${{ steps.release.outputs.publish }}
          STRICT_SIGNING: ${{ vars.ORBIT_REQUIRE_RELEASE_SIGNING }}
          ORBIT_KEYSTORE_BASE64: ${{ secrets.ORBIT_KEYSTORE_BASE64 }}
          ORBIT_RELEASE_STORE_PASSWORD: ${{ secrets.ORBIT_RELEASE_STORE_PASSWORD }}
          ORBIT_RELEASE_KEY_ALIAS: ${{ secrets.ORBIT_RELEASE_KEY_ALIAS }}
          ORBIT_RELEASE_KEY_PASSWORD: ${{ secrets.ORBIT_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${ORBIT_KEYSTORE_BASE64:-}" ] && \
             [ -n "${ORBIT_RELEASE_STORE_PASSWORD:-}" ] && \
             [ -n "${ORBIT_RELEASE_KEY_ALIAS:-}" ] && \
             [ -n "${ORBIT_RELEASE_KEY_PASSWORD:-}" ]; then
            mkdir -p android-signing
            echo "$ORBIT_KEYSTORE_BASE64" | base64 -d > android-signing/release.keystore
            chmod 600 android-signing/release.keystore
            if [ ! -s android-signing/release.keystore ]; then
              echo "::error::Decoded keystore is empty"
              exit 1
            fi
            if ! keytool -list -keystore android-signing/release.keystore \
                -storepass "$ORBIT_RELEASE_STORE_PASSWORD" >/dev/null 2>&1; then
              echo "::error::Keystore cannot be opened with the given store password"
              exit 1
            fi
            {
              echo "ORBIT_KEYSTORE_PATH=$GITHUB_WORKSPACE/android-signing/release.keystore"
              echo "ORBIT_RELEASE_STORE_PASSWORD=$ORBIT_RELEASE_STORE_PASSWORD"
              echo "ORBIT_RELEASE_KEY_ALIAS=$ORBIT_RELEASE_KEY_ALIAS"
              echo "ORBIT_RELEASE_KEY_PASSWORD=$ORBIT_RELEASE_KEY_PASSWORD"
              echo "ORBIT_REQUIRE_RELEASE_SIGNING=0"
              echo "SIGNED=true"
            } >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets found — will sign with release keystore"
          else
            if [ "${STRICT_SIGNING:-}" = "true" ] && [ "${PUBLISH_REQUESTED:-}" = "true" ]; then
              echo "::error::ORBIT_REQUIRE_RELEASE_SIGNING=true but the ORBIT_* signing secrets are missing."
              exit 1
            fi
            if [ "${PUBLISH_REQUESTED:-}" = "true" ]; then
              echo "::warning::Publishing a debug-signed build because release-signing secrets are not configured."
            fi
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "No release signing secrets — build will use the debug keystore"
          fi

      - name: Verify Rust sandbox crate
        run: |
          set -euo pipefail
          test -f sandbox-core/Cargo.toml
          test -f sandbox-core/Cargo.lock
          cargo metadata --manifest-path sandbox-core/Cargo.toml --no-deps --format-version 1 >/dev/null

      - name: Rust sandbox core tests
        run: cargo test --locked --manifest-path sandbox-core/Cargo.toml

      # cargo-ndk loads crate metadata from the current directory, so this step
      # must run from sandbox-core. The output path is absolute because Metro
      # and Gradle consume it from the repository root.
      - name: Build Rust sandbox library for Android
        working-directory: sandbox-core
        run: |
          set -euo pipefail
          JNI_DIR="${GITHUB_WORKSPACE}/modules/orbit-mobile-sandbox/android/src/main/jniLibs"
          mkdir -p "$JNI_DIR"
          cargo ndk \
            -t armeabi-v7a \
            -t arm64-v8a \
            -t x86 \
            -t x86_64 \
            -o "$JNI_DIR" \
            build --release --locked
          for abi in armeabi-v7a arm64-v8a x86 x86_64; do
            if [ ! -s "$JNI_DIR/$abi/liborbit_sandbox_core.so" ]; then
              echo "::error::Missing $abi liborbit_sandbox_core.so"
              exit 1
            fi
          done
          find "$JNI_DIR" -name 'liborbit_sandbox_core.so' -print

      - name: Expo prebuild (Android)
        run: npx expo prebuild --platform android --no-install

      - name: Build debug APK
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Build release APK + AAB
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Collect artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/ORBIT-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/ORBIT-release.apk
          cp android/app/build/outputs/bundle/release/app-release.aab artifacts/ORBIT-release.aab

          for f in ORBIT-debug.apk ORBIT-release.apk ORBIT-release.aab; do
            if [ ! -s "artifacts/$f" ]; then
              echo "::error::Missing or empty: $f"
              exit 1
            fi
            unzip -tq "artifacts/$f" >/dev/null
          done

          # The sandbox native core must ship in every Android artifact.
          for f in ORBIT-debug.apk ORBIT-release.apk ORBIT-release.aab; do
            if ! unzip -l "artifacts/$f" | grep -q 'liborbit_sandbox_core.so'; then
              echo "::error::$f is missing liborbit_sandbox_core.so"
              exit 1
            fi
          done

          (cd artifacts && sha256sum ORBIT-debug.apk ORBIT-release.apk ORBIT-release.aab > SHA256SUMS.txt)

          {
            echo "commit=$GITHUB_SHA"
            echo "ref=$GITHUB_REF"
            echo "event=$GITHUB_EVENT_NAME"
            echo "run_id=$GITHUB_RUN_ID"
            echo "app_version=${{ steps.ver.outputs.version }}"
            echo "package=com.orbit.app"
            echo "signed=${{ steps.signing.outputs.signed }}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > artifacts/build-info.txt

          ls -la artifacts
          cat artifacts/build-info.txt
          cat artifacts/SHA256SUMS.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ORBIT-android
          path: artifacts/*
          if-no-files-found: error
          overwrite: true
          retention-days: 14

      - name: Cleanup keystore
        if: always()
        run: rm -rf android-signing

      - name: Build summary
        if: always()
        env:
          APP_VERSION: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
          PUBLISH: ${{ steps.release.outputs.publish }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          {
            echo "### Android build"
            echo "- Version: \`${APP_VERSION:-unknown}\`"
            echo "- Signing: \`${SIGNED:-unknown}\`"
            if [ "$PUBLISH" = "true" ]; then
              echo "- Release: requested for \`${RELEASE_TAG:-<missing tag>}\`"
            else
              echo "- Release: not requested (artifact-only run)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    steps:
      - name: Validate release inputs
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          APP_VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
          STRICT_SIGNING: ${{ vars.ORBIT_REQUIRE_RELEASE_SIGNING }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Releases must be published from main (got $REF)"
            exit 1
          fi
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Release tag must look like v1.10.6 (got '$RELEASE_TAG')"
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v${APP_VERSION}" ]; then
            echo "::error::Release tag must equal v${APP_VERSION} (app.json version), got '$RELEASE_TAG'"
            exit 1
          fi
          if [ "$SIGNED" != "true" ] && [ "${STRICT_SIGNING:-}" = "true" ]; then
            echo "::error::ORBIT_REQUIRE_RELEASE_SIGNING=true and this build is unsigned."
            exit 1
          fi
          if [ "$SIGNED" != "true" ]; then
            echo "::warning::Publishing a debug-signed build (set ORBIT_REQUIRE_RELEASE_SIGNING=true to block this)."
          fi
          echo "Will publish $RELEASE_TAG (signed=$SIGNED)"

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ORBIT-android
          path: release-assets

      - name: Verify artifacts
        env:
          APP_VERSION: ${{ needs.build.outputs.version }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail
          cd release-assets
          for f in ORBIT-release.apk ORBIT-release.aab SHA256SUMS.txt build-info.txt; do
            if [ ! -s "$f" ]; then
              echo "::error::Missing release asset: $f"
              exit 1
            fi
          done
          for f in ORBIT-release.apk ORBIT-release.aab; do
            unzip -tq "$f" >/dev/null
          done
          sha256sum -c SHA256SUMS.txt
          actual_signed="$(sed -n 's/^signed=//p' build-info.txt)"
          if [ "$actual_signed" != "$SIGNED" ]; then
            echo "::error::build-info.txt says signed=$actual_signed, expected signed=$SIGNED"
            exit 1
          fi
          grep -qx "app_version=${APP_VERSION}" build-info.txt || { echo "::error::build-info.txt app version does not match"; exit 1; }
          cat build-info.txt
          cat SHA256SUMS.txt

      - name: Create draft, verify, then publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.build.outputs.tag }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump version and use a new tag."
            exit 1
          fi

          if printf '%s' "$TAG" | grep -q -- '-'; then
            release_flags=(--prerelease)
          else
            release_flags=(--latest)
          fi

          if [ "$SIGNED" = "true" ]; then
            notes=(--generate-notes)
          else
            echo "::warning::Publishing a debug-signed build."
            notes=(--notes "⚠️ This is a **debug-signed** build, intended for sideloading/testing. It is not Play Store ready. See \`build-info.txt\` for details.")
          fi

          cleanup() {
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
          }
          trap cleanup ERR

          gh release create "$TAG" \
            release-assets/ORBIT-release.apk \
            release-assets/ORBIT-release.aab \
            release-assets/SHA256SUMS.txt \
            release-assets/build-info.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            "${notes[@]}" \
            "${release_flags[@]}" \
            --draft

          asset_names="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          for f in ORBIT-release.apk ORBIT-release.aab SHA256SUMS.txt build-info.txt; do
            if ! printf '%s\n' "$asset_names" | grep -Fxq "$f"; then
              echo "::error::Draft release $TAG is missing asset $f"
              exit 1
            fi
          done

          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
          trap - ERR

          url=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)
          echo "Published: $url"
          echo "### Release $TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: \`$SIGNED\`" >> "$GITHUB_STEP_SUMMARY"
