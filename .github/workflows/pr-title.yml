name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          pattern='^(feat|fix|chore|docs|style|refactor|perf|test|build|ci|revert)(\([a-z0-9._/-]+\))?!?: .+'
          if ! printf '%s' "$PR_TITLE" | grep -Eq "$pattern"; then
            echo "::error::PR title must be a Conventional Commit, e.g. 'fix(settings): stop duplicate listeners'."
            echo "Got: $PR_TITLE"
            exit 1
          fi
          if [ "${#PR_TITLE}" -gt 100 ]; then
            echo "::error::PR title is ${#PR_TITLE} characters; keep it at 100 or fewer."
            exit 1
          fi
          echo "PR title OK: $PR_TITLE"
