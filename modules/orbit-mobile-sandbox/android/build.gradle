plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.orbit.sandbox'
version = '0.1.0'

android {
  namespace "com.orbit.sandbox"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  lintOptions {
    abortOnError false
  }
}
